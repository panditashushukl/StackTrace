<div class="min-h-screen bg-slate-950 flex flex-col justify-center py-10 px-4 sm:px-6 text-slate-100">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <a routerLink="/analyses" class="flex items-center justify-center gap-2.5 group">
      <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-cyan-500 flex items-center justify-center shadow-lg shadow-indigo-500/20 font-mono text-base font-bold text-white">
        &gt;_
      </div>
      <span class="text-2xl font-bold tracking-tight text-white group-hover:text-indigo-300 transition">
        StackTrace Buddy
      </span>
    </a>
  </div>

  <div class="mt-6 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-slate-900/90 py-7 px-6 shadow-2xl ring-1 ring-slate-800 rounded-2xl sm:px-8">
      <!-- Mode Switcher -->
      <div class="grid grid-cols-2 gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800 mb-6">
        <button
          type="button"
          (click)="switchMode('login')"
          [class]="mode() === 'login'
            ? 'py-2 text-xs font-semibold rounded-lg bg-slate-800 text-white shadow-sm transition cursor-pointer'
            : 'py-2 text-xs font-medium rounded-lg text-slate-400 hover:text-slate-200 transition cursor-pointer'"
        >
          Sign in
        </button>
        <button
          type="button"
          (click)="switchMode('register')"
          [class]="mode() === 'register'
            ? 'py-2 text-xs font-semibold rounded-lg bg-slate-800 text-white shadow-sm transition cursor-pointer'
            : 'py-2 text-xs font-medium rounded-lg text-slate-400 hover:text-slate-200 transition cursor-pointer'"
        >
          Create account
        </button>
      </div>

      @if (errorMessage()) {
        <div class="mb-5 rounded-lg bg-red-950/60 p-3 border border-red-500/40 text-xs text-red-300">
          {{ errorMessage() }}
        </div>
      }

      @if (mode() === 'login') {
        <form (ngSubmit)="submitLogin()" class="space-y-4">
          <div>
            <label for="identifier" class="block text-xs font-medium text-slate-300 mb-1.5">
              Username or Email
            </label>
            <input
              id="identifier"
              name="identifier"
              type="text"
              [(ngModel)]="identifier"
              autocomplete="username"
              placeholder="you@example.com or username"
              class="w-full rounded-xl bg-slate-950 border border-slate-800 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
            />
          </div>

          <div>
            <label for="password" class="block text-xs font-medium text-slate-300 mb-1.5">
              Password
            </label>
            <input
              id="password"
              name="password"
              type="password"
              [(ngModel)]="password"
              autocomplete="current-password"
              placeholder="Enter password"
              class="w-full rounded-xl bg-slate-950 border border-slate-800 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
            />
          </div>

          <button
            type="submit"
            [disabled]="submitting()"
            class="w-full py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-sm font-semibold text-white transition cursor-pointer"
          >
            {{ submitting() ? 'Signing in...' : 'Sign in' }}
          </button>
        </form>
      } @else {
        <form (ngSubmit)="submitRegister()" class="space-y-3.5">
          <div>
            <label for="regName" class="block text-xs font-medium text-slate-300 mb-1">Name</label>
            <input
              id="regName"
              name="regName"
              type="text"
              [(ngModel)]="regName"
              placeholder="Your name"
              class="w-full rounded-xl bg-slate-950 border border-slate-800 px-3.5 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
            />
          </div>

          <div>
            <label for="regUsername" class="block text-xs font-medium text-slate-300 mb-1">Username</label>
            <input
              id="regUsername"
              name="regUsername"
              type="text"
              [(ngModel)]="regUsername"
              placeholder="dev_handle"
              class="w-full rounded-xl bg-slate-950 border border-slate-800 px-3.5 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
            />
          </div>

          <div>
            <label for="regEmail" class="block text-xs font-medium text-slate-300 mb-1">Email</label>
            <input
              id="regEmail"
              name="regEmail"
              type="email"
              [(ngModel)]="regEmail"
              placeholder="you@example.com"
              class="w-full rounded-xl bg-slate-950 border border-slate-800 px-3.5 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
            />
          </div>

          <div>
            <label for="regPassword" class="block text-xs font-medium text-slate-300 mb-1">Password</label>
            <input
              id="regPassword"
              name="regPassword"
              type="password"
              [(ngModel)]="regPassword"
              placeholder="Minimum 8 characters"
              class="w-full rounded-xl bg-slate-950 border border-slate-800 px-3.5 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
            />
          </div>

          <button
            type="submit"
            [disabled]="submitting()"
            class="w-full py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-sm font-semibold text-white transition cursor-pointer"
          >
            {{ submitting() ? 'Creating account...' : 'Create account' }}
          </button>
        </form>
      }

      <div class="relative my-5">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-slate-800"></div>
        </div>
        <div class="relative flex justify-center text-xs">
          <span class="bg-slate-900 px-3 text-slate-500">or</span>
        </div>
      </div>

      <button
        type="button"
        (click)="signInWithGoogle()"
        class="w-full flex items-center justify-center gap-2.5 py-2.5 px-4 rounded-xl border border-slate-700 bg-slate-800/80 text-sm font-medium text-white hover:bg-slate-700/80 transition cursor-pointer"
      >
        <svg class="w-4 h-4" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
        </svg>
        Continue with Google
      </button>

      <div class="mt-5 text-center">
        <a routerLink="/analyses" class="text-xs text-slate-400 hover:text-indigo-400 transition">
          Continue without signing in &rarr;
        </a>
      </div>
    </div>
  </div>
</div>
